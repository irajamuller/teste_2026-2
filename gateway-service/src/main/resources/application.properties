server.port=8005

spring.application.name=GATEWAY-SERVICE

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

spring.cloud.gateway.server.webflux.routes[0].id=ACOES-SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ACOES-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/acoes/**

spring.cloud.gateway.server.webflux.routes[1].id=COTACOES-SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=lb://COTACOES-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/cotacoes/**
